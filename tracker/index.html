<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="记账">
  <link rel="manifest" href="manifest.json">
  <title>记账统计</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="widget-container">
    <div class="widget-header">
      <div class="header-title">📊 记账统计</div>
      <div class="header-actions">
        <div class="top-toggle" id="topToggle" title="置顶/取消置顶">📌</div>
        <div class="settings-toggle" id="settingsToggle" title="设置">⚙</div>
      </div>
    </div>

    <div class="toolbar">
      <button class="tool-btn" id="addRowBtn" title="添加行">+ 行</button>
      <button class="tool-btn" id="addColBtn" title="添加列">+ 列</button>
      <button class="tool-btn" id="importBtn" title="导入Excel">📥 导入</button>
      <button class="tool-btn" id="exportBtn" title="导出Excel">📤 导出</button>
      <button class="tool-btn danger" id="clearAllBtn" title="清空所有">🗑</button>
      <div class="date-filter">
        <input type="month" id="monthFilter">
      </div>
    </div>

    <div class="table-container">
      <table class="data-table" id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>

    <div class="status-bar">
      <span id="statusText">数据已保存</span>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <span class="settings-title">设置</span>
      <span class="settings-close" id="settingsClose">✕</span>
    </div>
    <div class="settings-content">
      <div class="setting-item">
        <label>透明度</label>
        <div class="opacity-slider">
          <input type="range" id="opacity" min="10" max="100" value="100">
          <span id="opacityValue">100%</span>
        </div>
      </div>

      <div class="setting-item">
        <label>始终置顶</label>
        <div class="toggle-switch">
          <input type="checkbox" id="alwaysOnTop" checked>
          <label for="alwaysOnTop"></label>
        </div>
      </div>

      <button class="save-btn" id="saveBtn">保存设置</button>
    </div>
  </div>

  <script src="api_adapter.js"></script>
  <!-- SheetJS (local) -->
  <script src="xlsx.full.min.js"></script>
  <script src="renderer.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function(e) {
        console.warn('SW registration failed:', e);
      });
    });
  }
  </script>
</body>
</html>
