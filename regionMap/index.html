<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a2942">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="行政区划地图">
  <link rel="manifest" href="manifest.json">
  <title>行政区划地图联动</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="widget-container">
    <div class="widget-header">
      <span class="header-title">🗺 行政区划地图联动</span>
      <div class="header-actions">
        <div class="header-btn" id="topToggle" title="置顶/取消">📌</div>
        <div class="header-btn" id="settingsToggle" title="设置">⚙</div>
        <div class="header-btn" id="minimizeBtn" title="最小化">—</div>
        <div class="header-btn close-btn" id="closeBtn" title="关闭">✕</div>
      </div>
    </div>

    <div class="breadcrumb" id="breadcrumb"></div>

    <div class="selector-bar">
      <div class="selector-item">
        <label>省/直辖市</label>
        <select id="provinceSelect" data-level="province">
          <option value="">— 选择 —</option>
        </select>
      </div>
      <div class="selector-item">
        <label>市</label>
        <select id="citySelect" data-level="city" disabled>
          <option value="">— 选择 —</option>
        </select>
      </div>
      <div class="selector-item">
        <label>区/县</label>
        <select id="countySelect" data-level="county" disabled>
          <option value="">— 选择 —</option>
        </select>
      </div>
      <div class="selector-item">
        <label>乡镇</label>
        <select id="townSelect" data-level="town" disabled>
          <option value="">— 选择 —</option>
        </select>
      </div>
      <div class="selector-item">
        <label>村</label>
        <select id="villageSelect" data-level="village" disabled>
          <option value="">— 选择 —</option>
        </select>
      </div>
      <button class="reset-btn" id="resetBtn" title="返回全国">⟲ 全国</button>
    </div>

    <div class="map-container" id="mapContainer"></div>

    <div class="status-bar">
      <span id="statusText">就绪</span>
      <span class="current-region" id="currentRegion"></span>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <span class="settings-title">设置</span>
      <span class="settings-close" id="settingsClose">✕</span>
    </div>
    <div class="settings-content">
      <div class="setting-item">
        <label>透明度</label>
        <div class="opacity-slider">
          <input type="range" id="opacity" min="10" max="100" value="100">
          <span id="opacityValue">100%</span>
        </div>
      </div>
      <div class="setting-item">
        <label>始终置顶</label>
        <div class="toggle-switch">
          <input type="checkbox" id="alwaysOnTop" checked>
          <label for="alwaysOnTop"></label>
        </div>
      </div>
      <div class="setting-item">
        <label>高德地图 Key</label>
        <div class="amap-key-wrap">
          <input type="text" id="amapKey" placeholder="留空使用公共Key（限频）" autocomplete="off">
          <span class="amap-key-hint">用于获取乡镇/村级坐标<br>申请地址: lbs.amap.com</span>
        </div>
      </div>
      <button class="save-btn" id="saveBtn">保存设置</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <script src="renderer.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('../sw.js').catch(function(e) {
        console.warn('SW registration failed:', e);
      });
    });
  }
  </script>
</body>
</html>
